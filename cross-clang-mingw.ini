[binaries]
; c = '/mnt/part2/owned/llvm-mingw-20250430-msvcrt-ubuntu-22.04-x86_64/bin/clang'
cpp = '/mnt/part2/owned/llvm-mingw-20250430-msvcrt-ubuntu-22.04-x86_64/bin/clang++'
ar = '/mnt/part2/owned/llvm-mingw-20250430-msvcrt-ubuntu-22.04-x86_64/bin/llvm-ar'
cpp_ld = '/mnt/part2/owned/llvm-mingw-20250430-msvcrt-ubuntu-22.04-x86_64/bin/ld.lld'
cmake = 'cmake'

[host_machine]
system = 'linux'
