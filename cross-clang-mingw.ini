[built-in options]
; c_args = ['-target=i686-w64-mingw32', '-fms-extensions', '-Iinclude']
cpp_args = ['--target=i686-w64-mingw32', '-fms-extensions']
; c_link_args = ['-target=i686-w64-mingw32']
cpp_link_args = ['--target=i686-w64-mingw32', '-static', '-shared']

[properties]
is_clang_mingw = 'true'
