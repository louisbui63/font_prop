[binaries]
cpp = 'clang++'
c = 'clang'
ar = 'llvm-lib'
strip = 'llvm-strip'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
cpp_args = ['--target=i386-windows-msvc', '-fuse-ld=lld', '-fms-extensions', '-fms-compatibility', '-std=c++23']
cpp_link_args = ['--target=i386-windows-msvc','-fuse-ld=lld','-shared','-Wl,-subsystem:windows','-Wl,-def=d2d1.def']

[env]
INCLUDE = /mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/atlmfc/include;/mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/include;/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/shared;/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/ucrt;/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/um;/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/winrt;/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/km
LIB = /mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/atlmfc/lib/x86;/mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/lib/x86;/mnt/part2/owned/msvc/kits/10/lib/10.0.22621.0/ucrt/x86;/mnt/part2/owned/msvc/kits/10/lib/10.0.22621.0/um/x86;/mnt/part2/owned/msvc/kits/10/lib/10.0.22621.0/km/x86
