[binaries]
cpp = 'clang++'
c = 'clang'
cpp_ld = 'lld'
ar = 'llvm-lib'
strip = 'llvm-strip'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[target_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[built-in options]
cpp_args = ['--target=i386-windows-msvc', '-fuse-ld=lld', '-fms-extensions', '-fms-compatibility', '-isystem/mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/atlmfc/include','-isystem/mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/include','-isystem/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/shared','-isystem/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/ucrt','-isystem/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/um','-isystem/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/winrt','-isystem/mnt/part2/owned/msvc/kits/10/include/10.0.22621.0/km']
cpp_link_args = ['-L/mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/atlmfc/lib/x86','-L/mnt/part2/owned/msvc/vc/tools/msvc/14.43.34808/lib/x86','-L/mnt/part2/owned/msvc/kits/10/lib/10.0.22621.0/ucrt/x86','-L/mnt/part2/owned/msvc/kits/10/lib/10.0.22621.0/um/x86','-L/mnt/part2/owned/msvc/kits/10/lib/10.0.22621.0/km/x86', '--target=i386-windows-msvc','-shared','-Wl,-subsystem:windows']

[properties]
is_clang_msvc = 'true'

